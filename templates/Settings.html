<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <style>

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #0b0b0f;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        .nav {
            height: 64px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #101016;
            border-bottom: 1px solid #292934;
        }

        .brand { font-weight: bold; }

        .nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 18px;
        }

        .nav a:hover { color: #fff; }

        .container {
            max-width: 520px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: #13131b;
            border: 1px solid #292934;
            border-radius: 13px;
            padding: 24px;
        }

        h1 { margin: 0 0 6px; }

        h2 { margin: 0 0 18px; font-size: 18px; }

        .muted { color: #888894; font-size: 14px; margin: 0 0 22px; }

        label {
            display: block;
            margin-bottom: 7px;
            color: #cfcfda;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: #1a1a23;
            color: white;
            border: 1px solid #30303b;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus { outline: none; border-color: #8054e8; }

        button {
            width: 100%;
            padding: 12px;
            background: #8054e8;
            color: white;
            border: 0;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #6944df; }

        .flash {
            padding: 11px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .flash.error { color: #ff7777; background: rgba(255,70,70,.12); }
        .flash.success { color: #63e49a; background: rgba(50,220,130,.1); }
        .flash.warning { color: #ffc45c; background: rgba(255,180,50,.1); }

    </style>

</head>

<body>

<div class="nav">

    <div class="brand">Settings</div>

    <div>

        {% if is_admin %}
            <a href="{{ url_for('admin') }}">Admin</a>
        {% else %}
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('my_logs') }}">Activity</a>
        {% endif %}

        <a href="{{ url_for('logout') }}">Logout</a>

    </div>

</div>

<div class="container">

    <h1>{{ username }}</h1>

    <p class="muted">Account settings</p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="flash {{ category }}">{{ message }}</div>

        {% endfor %}

    {% endwith %}

    <div class="card">

        <h2>Change Password</h2>

        <form method="POST" action="{{ url_for('settings') }}">

            <label for="current_password">Current Password</label>
            <input type="password" id="current_password" name="current_password"
                   autocomplete="current-password" required>

            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password"
                   minlength="6" maxlength="128" autocomplete="new-password"
                   placeholder="At least 6 characters" required>

            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password"
                   minlength="6" maxlength="128" autocomplete="new-password" required>

            <button type="submit">Save Password</button>

        </form>

    </div>

</div>

</body>
</html>

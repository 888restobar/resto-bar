<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Duty System - Login</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at top,
            #1d1632,
            #08080c 60%
        );

    color: white;

    font-family: Arial, sans-serif;
}

.box {
    width: 380px;

    padding: 32px;

    background: #15151d;

    border: 1px solid #30303c;

    border-radius: 16px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.55);
}

.logo {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 20px;

    border-radius: 12px;

    background: #7d55ff;

    font-weight: bold;
    font-size: 20px;
}

h1 {
    margin: 0 0 7px;

    font-size: 27px;
}

.subtitle {
    margin-bottom: 25px;

    color: #9999a8;

    font-size: 14px;
}

label {
    display: block;

    margin-bottom: 7px;

    color: #cfcfda;

    font-size: 14px;
}

input {
    width: 100%;

    padding: 13px;

    margin-bottom: 16px;

    border: 1px solid #353542;

    border-radius: 9px;

    outline: none;

    background: #20202a;

    color: white;

    font-size: 15px;
}

input:focus {
    border-color: #7d55ff;
}

button {
    width: 100%;

    padding: 13px;

    border: 0;

    border-radius: 9px;

    background: #7d55ff;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #6944df;
}

.message {
    padding: 11px;

    margin-bottom: 16px;

    border-radius: 8px;

    font-size: 14px;
}

.error {
    background: rgba(255,70,70,.12);

    color: #ff7777;
}

.success {
    background: rgba(50,220,130,.1);

    color: #63e49a;
}

.warning {
    background: rgba(255,180,50,.1);

    color: #ffc45c;
}

</style>

</head>

<body>

<div class="box">

<div class="logo">
    D
</div>

<h1>
    Duty System
</h1>

<div class="subtitle">
    Sign in to continue.
</div>

{% with messages = get_flashed_messages(with_categories=true) %}

{% for category, message in messages %}

<div class="message {{ category }}">
    {{ message }}
</div>

{% endfor %}

{% endwith %}

<form method="POST">

<label>
    Username
</label>

<input
    type="text"
    name="username"
    placeholder="Username"
    required
>

<label>
    Password
</label>

<input
    type="password"
    name="password"
    placeholder="Password"
    required
>

<button type="submit">
    Login
</button>

</form>
</div>

</body>
</html>
